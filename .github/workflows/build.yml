name: Build & Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Linux build inside Manylinux 2.28 (GLIBC 2.28 / GCC 14) ────────
  build-linux:
    name: Build (linux-amd64) [GLIBC 2.28]
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    steps:

      - name: Install Go
        run: |
          GO_VERSION=$(curl -fsSL 'https://go.dev/dl/?mode=json' | \
            grep -oP '"version":\s*"go\K1\.26\.[0-9]+' | head -1)
          echo "Installing go${GO_VERSION}"
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" \
            -o /tmp/go.tar.gz
          tar -C /usr/local -xzf /tmp/go.tar.gz
          rm /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Go module cache
        uses: actions/cache@v4
        with:
          path: |
            /root/go/pkg/mod
            /root/.cache/go-build
          key: ${{ runner.os }}-go-linux-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-linux-

      - name: Run tests
        run: go test -v -buildvcs=false ./...

      - name: Build binary
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -v -buildvcs=false -ldflags="-s -w" \
            -o dist/g3a-linux-amd64 .

      - name: Verify GLIBC compatibility
        run: |
          echo "=== ldd ==="
          ldd dist/g3a-linux-amd64 || true
          echo ""
          echo "=== Required GLIBC versions ==="
          objdump -T dist/g3a-linux-amd64 | grep -oP 'GLIBC_[0-9.]+' | sort -uV
          echo ""
          echo "=== Required GLIBCXX versions ==="
          objdump -T dist/g3a-linux-amd64 | grep -oP 'GLIBCXX_[0-9.]+' | sort -uV || true
          echo ""
          echo "=== Required CXXABI versions ==="
          objdump -T dist/g3a-linux-amd64 | grep -oP 'CXXABI_[0-9.]+' | sort -uV || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: g3a-linux-amd64
          path: dist/g3a-linux-amd64

  # ── Windows build (native runner) ───────────────────────────────────
  build-windows:
    name: Build (windows-amd64)
    needs: [build-linux]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Run tests
        run: go test -v ./...

      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist
          go build -v -ldflags="-s -w" -o dist/g3a-windows-amd64.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: g3a-windows-amd64.exe
          path: dist/g3a-windows-amd64.exe

  # ── Release ─────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
